grafana:
  adminPassword: "admin"
  persistence:
    enabled: false
  # Dashboards are shipped as ConfigMaps labeled grafana_dashboard: "1" in
  # grafana/nginx-dashboard.yaml. The Grafana sidecar (k8s-sidecar, default
  # in kube-prometheus-stack) watches for these and hot-loads them -- no
  # Grafana pod restart is needed, and no dashboardsConfigMaps static injection.

prometheus:
  prometheusSpec:
    retention: 24h
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi

    # Watch ALL ServiceMonitors and PodMonitors cluster-wide, regardless of
    # chart labels. The NGINX Ingress chart (values/nginx-ingress.yaml) creates
    # its own ServiceMonitor via serviceMonitor.create: true -- this is how it
    # gets discovered. No additionalScrapeConfigs needed.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

alertmanager:
  enabled: false

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
