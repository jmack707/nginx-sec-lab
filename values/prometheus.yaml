grafana:
  adminPassword: "admin"
  persistence:
    enabled: false
  # Dashboard will be imported manually via: kubectl apply -f grafana/nginx-dashboard.yaml
  # Removing dashboardsConfigMaps here to avoid Grafana pod getting stuck
  # waiting for a ConfigMap that doesn't exist at install time.

prometheus:
  prometheusSpec:
    retention: 24h
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

alertmanager:
  enabled: false

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

additionalScrapeConfigs:
  - job_name: nginx-ingress
    static_configs:
      - targets:
          - nginx-ingress.nginx-ingress.svc.cluster.local:9113
