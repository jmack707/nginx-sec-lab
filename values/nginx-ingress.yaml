controller:
  kind: deployment
  replicaCount: 1

  # App Protect WAF requires NGINX Plus -- disabled for OSS
  appprotect:
    enable: false
  appprotectdos:
    enable: false

  enableCustomResources: true
  enablePreviewPolicies: true

  # Expose the NGINX metrics endpoint on :9113 on the controller pod.
  # The ServiceMonitor below (serviceMonitor.create: true) exposes this
  # target to Prometheus via Kubernetes service discovery -- no static
  # scrape config is needed in values/prometheus.yaml.
  prometheus:
    create: true
    port: 9113

  # Native Prometheus Operator integration. The chart creates a ServiceMonitor
  # in the nginx-ingress namespace pointing at the /metrics endpoint above.
  # It's discovered cluster-wide because values/prometheus.yaml sets
  # serviceMonitorSelectorNilUsesHelmValues: false (match all ServiceMonitors).
  serviceMonitor:
    create: true

  # LoadBalancer -- k3d routes external ports to this service
  service:
    type: LoadBalancer
    externalTrafficPolicy: Local

  # Default TLS secret (created by pre-deploy.sh)
  defaultTLS:
    secret: nginx-ingress/default-server-secret

  config:
    name: nginx-config
    entries:
      proxy-connect-timeout: "30s"
      proxy-read-timeout: "60s"
      client-max-body-size: "10m"
      server-tokens: "off"
      ssl-protocols: "TLSv1.2 TLSv1.3"
      ssl-ciphers: "HIGH:!aNULL:!MD5"
