---
# GoTestWAF — automated WAF bypass and coverage testing
# Runs inside the cluster against NGINX Ingress via ClusterIP.
#
# DO NOT apply this file directly — use:
#   task scan                   (resolves INGRESS_IP_PLACEHOLDER at runtime)
#
# The INGRESS_IP_PLACEHOLDER in hostAliases is substituted by
# scripts/resolve-ingress-ip.sh before kubectl apply.
#
# Docs: https://github.com/wallarm/gotestwaf
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scanner-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scanner-role
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scanner-rolebinding
subjects:
  - kind: ServiceAccount
    name: scanner-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: scanner-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gotestwaf-scan
  namespace: default
  labels:
    app: gotestwaf
    lab: nginx-sec-lab
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: gotestwaf
    spec:
      restartPolicy: Never
      serviceAccountName: scanner-sa

      # INGRESS_IP_PLACEHOLDER is replaced by scripts/resolve-ingress-ip.sh
      # at task scan time with the actual nginx-ingress ClusterIP.
      hostAliases:
        - ip: "INGRESS_IP_PLACEHOLDER"
          hostnames:
            - crapi.lab.local
            - juiceshop.lab.local
            - dvga.lab.local
            - vampi.lab.local

      containers:
        - name: gotestwaf
          image: wallarm/gotestwaf:latest
          args:
            - "--url=https://crapi.lab.local"
            # TLS verification disabled: GoTestWAF container has no
            # copy of the lab's self-signed CA. Omitting the flag
            # defaults to "not present" = no verification, so we just
            # don't pass it.
            - "--noEmailReport"
            # reportFormat accepts: none, json, html, pdf
            # html renders well in a browser and includes full detail.
            - "--reportFormat=html"
            - "--reportPath=/results"
            - "--workers=5"
            # sendDelay is milliseconds as an INTEGER, not a Go duration string
            # ("--sendDelay=100ms" fails with strconv.ParseInt error).
            - "--sendDelay=100"
            - "--logLevel=info"
            # Non-blocked requests are passed (default); since the WAF
            # is off, this is the expected "attacks succeeded" baseline.
            - "--nonBlockedAsPassed"
            # Skip GoTestWAF's WAF pre-check entirely. By default the tool
            # fires one attack request and aborts with
            #   "WAF was not detected. Please use --blockStatusCodes..."
            # if the response isn't blocked. That's backwards for a
            # WAF-off baseline run -- we *want* to scan with no WAF and
            # record "everything bypassed". --skipWAFBlockCheck removes
            # the pre-check gate so the scan proceeds.
            - "--skipWAFBlockCheck"
            # Declare the "blocked" status code for scoring. Since the WAF
            # is off, nothing will return 999 and every attack will score
            # as bypassed -- exactly the expected baseline shape.
            - "--blockStatusCodes=999"
          volumeMounts:
            - name: results
              mountPath: /results
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"

      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: scan-results-pvc
