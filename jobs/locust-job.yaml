---
# Locust — realistic API traffic generation against crAPI
# Simulates a mix of authenticated user actions:
#   - Login / token refresh
#   - Vehicle lookup (triggers BOLA opportunity)
#   - Community post read/write
#   - Workshop mechanic requests (triggers SSRF opportunity)
#   - Shop browsing and order placement
#
# Runs as a headless job (no UI) — use task locust:ui for interactive mode
# Docs: https://locust.io
apiVersion: v1
kind: ConfigMap
metadata:
  name: locust-script
  namespace: default
data:
  locustfile.py: |
    import random
    import json
    from locust import HttpUser, task, between, events

    USERS = [
        {"email": "user1@lab.local", "password": "Passw0rd!"},
        {"email": "user2@lab.local", "password": "Passw0rd!"},
    ]

    class CrAPIUser(HttpUser):
        host = "https://crapi.lab.local"
        wait_time = between(1, 3)
        token = None
        vehicle_id = None

        def on_start(self):
            """Login and cache JWT token on user spawn."""
            creds = random.choice(USERS)
            with self.client.post(
                "/identity/api/auth/login",
                json={"email": creds["email"], "password": creds["password"]},
                verify=False,
                catch_response=True,
            ) as resp:
                if resp.status_code == 200:
                    self.token = resp.json().get("token")
                    resp.success()
                else:
                    resp.failure(f"Login failed: {resp.status_code}")

        def auth_headers(self):
            return {"Authorization": f"Bearer {self.token}"} if self.token else {}

        @task(5)
        def get_dashboard(self):
            """Fetch user dashboard — most frequent action."""
            self.client.get(
                "/identity/api/v2/user/dashboard",
                headers=self.auth_headers(),
                verify=False,
                name="/identity/api/v2/user/dashboard",
            )

        @task(4)
        def list_vehicles(self):
            """List user vehicles — BOLA target endpoint."""
            with self.client.get(
                "/identity/api/v2/vehicle/vehicles",
                headers=self.auth_headers(),
                verify=False,
                catch_response=True,
                name="/identity/api/v2/vehicle/vehicles",
            ) as resp:
                if resp.status_code == 200:
                    vehicles = resp.json()
                    if vehicles:
                        self.vehicle_id = vehicles[0].get("uuid")
                    resp.success()

        @task(3)
        def get_community_posts(self):
            """Browse community posts."""
            self.client.get(
                "/community/api/v2/community/posts/recent",
                headers=self.auth_headers(),
                verify=False,
                name="/community/api/v2/community/posts/recent",
            )

        @task(2)
        def create_community_post(self):
            """Create a community post."""
            self.client.post(
                "/community/api/v2/community/posts",
                headers=self.auth_headers(),
                json={
                    "title": f"Lab traffic post {random.randint(1000, 9999)}",
                    "content": "This is synthetic lab traffic from Locust.",
                },
                verify=False,
                name="/community/api/v2/community/posts [POST]",
            )

        @task(2)
        def get_mechanics(self):
            """Browse workshop mechanics — SSRF adjacent endpoint."""
            self.client.get(
                "/workshop/api/mechanic",
                headers=self.auth_headers(),
                verify=False,
                name="/workshop/api/mechanic",
            )

        @task(1)
        def get_shop_products(self):
            """Browse shop products."""
            self.client.get(
                "/workshop/api/shop/products",
                headers=self.auth_headers(),
                verify=False,
                name="/workshop/api/shop/products",
            )

        @task(1)
        def check_coupon(self):
            """Validate a (fake) coupon — NoSQL injection target endpoint."""
            self.client.post(
                "/workshop/api/shop/apply_coupon",
                headers=self.auth_headers(),
                json={"coupon_code": f"TESTCOUPON{random.randint(100,999)}"},
                verify=False,
                name="/workshop/api/shop/apply_coupon",
            )
---
apiVersion: batch/v1
kind: Job
metadata:
  name: locust-traffic
  namespace: default
  labels:
    app: locust
    lab: nginx-sec-lab
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: locust
    spec:
      restartPolicy: Never

      hostAliases:
        - ip: "INGRESS_IP_PLACEHOLDER"
          hostnames:
            - crapi.lab.local

      containers:
        - name: locust
          image: locustio/locust:latest
          command:
            - locust
          args:
            - "--headless"
            - "--users=20"
            - "--spawn-rate=2"
            - "--run-time=5m"
            - "--host=https://crapi.lab.local"
            - "--locustfile=/locust/locustfile.py"
            - "--html=/results/locust-report.html"
            - "--csv=/results/locust"
          volumeMounts:
            - name: locust-script
              mountPath: /locust
            - name: results
              mountPath: /results
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"

      volumes:
        - name: locust-script
          configMap:
            name: locust-script
        - name: results
          persistentVolumeClaim:
            claimName: scan-results-pvc
