---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vapi
  namespace: vapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vapi
  template:
    metadata:
      labels:
        app: vapi
    spec:
      initContainers:
        # Wait for MySQL before starting vAPI
        - name: wait-for-db
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              until nc -z vapi-db 3306; do
                echo "Waiting for MySQL..."; sleep 2
              done
              echo "MySQL ready"
      containers:
        - name: vapi
          image: roottusk/vapi:latest
          ports:
            - containerPort: 80
          env:
            - name: DB_HOST
              value: vapi-db
            - name: DB_DATABASE
              value: vapi
            - name: DB_USERNAME
              value: vapi
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vapi-db-secret
                  key: password
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
