---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vapi
  namespace: vapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vapi
  template:
    metadata:
      labels:
        app: vapi
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.35
          command: ["sh", "-c", "until nc -z vapi-db 3306; do echo waiting; sleep 2; done"]
      containers:
        - name: vapi
          image: gilbrea/vapi:latest
          ports:
            - containerPort: 80
          env:
            - name: DB_HOST
              value: vapi-db
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: vapi
            - name: DB_USERNAME
              value: vapi_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vapi-db-secret
                  key: password
          readinessProbe:
            httpGet:
              path: /vapi/
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
