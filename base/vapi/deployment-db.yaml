---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vapi-db
  namespace: vapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vapi-db
  template:
    metadata:
      labels:
        app: vapi-db
    spec:
      containers:
        - name: mysql
          # MariaDB instead of MySQL 5.7 -- MySQL 5.7 requires x86-64-v2 CPU
          # which is not available on all lab VMs. MariaDB 10.6 is compatible
          # with vAPI and runs on all CPU types.
          image: mariadb:10.6
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: vapi
            - name: MYSQL_USER
              value: vapi
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vapi-db-secret
                  key: password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vapi-db-secret
                  key: root-password
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 12
      volumes:
        - name: mysql-data
          emptyDir: {}
