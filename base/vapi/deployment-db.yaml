---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vapi-db
  namespace: vapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vapi-db
  template:
    metadata:
      labels:
        app: vapi-db
    spec:
      initContainers:
        - name: import-schema
          image: mysql:8.0
          command:
            - sh
            - -c
            - |
              until mysqladmin ping -h 127.0.0.1 -u root -p"${MYSQL_ROOT_PASSWORD}" --silent 2>/dev/null; do
                echo "Waiting for MySQL..."; sleep 2
              done
              mysql -h 127.0.0.1 -u root -p"${MYSQL_ROOT_PASSWORD}" vapi < /docker-entrypoint-initdb.d/vapi.sql 2>&1 || echo "Schema import done"
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vapi-db-secret
                  key: root-password
      containers:
        - name: vapi-db
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vapi-db-secret
                  key: root-password
            - name: MYSQL_DATABASE
              value: vapi
            - name: MYSQL_USER
              value: vapi_user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vapi-db-secret
                  key: password
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
