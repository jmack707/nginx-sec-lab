---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vapi-db
  namespace: vapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vapi-db
  template:
    metadata:
      labels:
        app: vapi-db
    spec:
      containers:
        - name: mysql
          image: mysql:5.7
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: vapi
            - name: MYSQL_USER
              value: vapi
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vapi-db-secret
                  key: password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vapi-db-secret
                  key: root-password
          args:
            - "--default-authentication-plugin=mysql_native_password"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: mysql-data
          emptyDir: {}
