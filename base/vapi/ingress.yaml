---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vapi
  namespace: vapi
  annotations:
    nginx.org/proxy-connect-timeout: "30s"
    nginx.org/proxy-read-timeout: "30s"
    nginx.org/client-max-body-size: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - vapi.1broken.net
      secretName: vapi-tls
  rules:
    - host: vapi.1broken.net
      http:
        paths:
          - path: /vapi
            pathType: Prefix
            backend:
              service:
                name: vapi
                port:
                  number: 80
