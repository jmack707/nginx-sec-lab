---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crapi-workshop
  namespace: crapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crapi-workshop
  template:
    metadata:
      labels:
        app: crapi-workshop
    spec:
      containers:
        - name: crapi-workshop
          image: crapi/workshop:latest
          ports:
            - containerPort: 8085
          env:
            - name: DB_NAME
              value: crapi
            - name: DB_USER
              value: admin
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crapi-db-secret
                  key: password
            - name: DB_HOST
              value: crapi-postgres
            - name: DB_PORT
              value: "5432"
            - name: IDENTITY_SERVICE
              value: "http://crapi-identity:8080"
            - name: MONGO_DB_HOST
              value: crapi-mongodb
            - name: MONGO_DB_PORT
              value: "27017"
            - name: MONGO_DB_NAME
              value: crapi
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
