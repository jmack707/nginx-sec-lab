---
# Passwords match OWASP crAPI official docker-compose
apiVersion: v1
kind: Secret
metadata:
  name: crapi-db-secret
  namespace: crapi
type: Opaque
stringData:
  password: "crapisecretpassword"
---
apiVersion: v1
kind: Secret
metadata:
  name: crapi-jwt-secret
  namespace: crapi
type: Opaque
stringData:
  secret: "crapi-secret-key-change-me"
---
apiVersion: v1
kind: Service
metadata:
  name: crapi-identity
  namespace: crapi
spec:
  selector:
    app: crapi-identity
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: crapi-community
  namespace: crapi
spec:
  selector:
    app: crapi-community
  ports:
    - port: 8087
      targetPort: 8087
---
apiVersion: v1
kind: Service
metadata:
  name: crapi-workshop
  namespace: crapi
spec:
  selector:
    app: crapi-workshop
  # gunicorn inside the container listens on 8000 (see pod log:
  # "Listening at: http://0.0.0.0:8000"). The previous port 8888 was
  # a stale value from an older crAPI release and caused 502s because
  # the Service's targetPort had no listener on the pod.
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: crapi-web
  namespace: crapi
spec:
  selector:
    app: crapi-web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  namespace: crapi
spec:
  selector:
    app: mailhog
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: http
      port: 8025
      targetPort: 8025
---
apiVersion: v1
kind: Service
metadata:
  name: crapi-mongodb
  namespace: crapi
spec:
  selector:
    app: crapi-mongodb
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: crapi-postgres
  namespace: crapi
spec:
  selector:
    app: crapi-postgres
  ports:
    - port: 5432
      targetPort: 5432