---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crapi-community
  namespace: crapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crapi-community
  template:
    metadata:
      labels:
        app: crapi-community
    spec:
      containers:
        - name: crapi-community
          image: crapi/crapi-community:latest
          ports:
            - containerPort: 8087
          env:
            - name: SERVER_PORT
              value: "8087"
            - name: DB_HOST
              value: crapi-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: admin
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crapi-db-secret
                  key: password
            - name: DB_NAME
              value: crapi
            - name: MONGO_DB_USER
              value: admin
            - name: MONGO_DB_PASSWORD
              value: crapisecretpassword
            - name: MONGO_DB_HOST
              value: crapi-mongodb
            - name: MONGO_DB_PORT
              value: "27017"
            - name: MONGO_DB_NAME
              value: crapi
            - name: IDENTITY_SERVICE
              value: "crapi-identity:8080"
            - name: INTERNAL_SERVICE_URL
              value: "crapi-identity:8080"
            - name: SECRET
              value: "crapi-secret-key-change-me"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
