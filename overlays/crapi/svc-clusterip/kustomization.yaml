---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# SVC-CLUSTERIP — crapi-web Service returned to ClusterIP (default)
# Access via NIC ingress only: https://crapi.<LAB_DOMAIN>
# Switch to NodePort: task svc:nodeport
namespace: crapi
resources:
  - ../../../base/crapi
patches:
  - patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort
    target:
      kind: Service
      name: crapi-web
