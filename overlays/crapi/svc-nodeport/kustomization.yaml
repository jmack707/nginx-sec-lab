---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# SVC-NODEPORT — crapi-web Service exposed on NodePort 30080
# Allows direct host:30080 access bypassing NIC.
# NodePort is pinned so it never changes across re-applies.
# NIC ingress path (HTTPS) continues to work simultaneously.
# Switch back: task svc:clusterip
namespace: crapi
resources:
  - ../../../base/crapi
patches:
  - patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
    target:
      kind: Service
      name: crapi-web
