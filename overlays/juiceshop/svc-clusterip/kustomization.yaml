---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# SVC-CLUSTERIP — juice-shop Service returned to ClusterIP (default)
# Access via NIC ingress only: https://juiceshop.<LAB_DOMAIN>
# Switch to NodePort: task svc:nodeport
namespace: juice-shop
resources:
  - ../../../base/juiceshop
patches:
  - patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort
    target:
      kind: Service
      name: juice-shop
