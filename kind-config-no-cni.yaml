---
# kind-config-no-cni.yaml — CNI disabled: for Cilium, Flannel, Calico
# Use this for: BIG-IP ClusterIP mode, custom CNI features
# Nodes will stay NotReady until CNI is installed via: task cni:install
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: nginx-sec-lab
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
      - |
        kind: KubeletConfiguration
        # Increase grace period — nodes stay NotReady until CNI installs
        nodeStatusUpdateFrequency: "4s"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
  - role: worker
networking:
  disableDefaultCNI: true         # ← kindnet disabled
  podSubnet: "10.244.0.0/16"      # Cilium will manage this range
  serviceSubnet: "10.96.0.0/12"
