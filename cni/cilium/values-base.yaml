# cni/cilium/values-base.yaml
# Cilium on kind — baseline config, no BIG-IP VTEP
# Use with: task cni:install CNI=cilium
# CIS pool-member-type: nodeport (BIG-IP cannot reach pod IPs without VTEP)

# ── Tunnel mode ────────────────────────────────────────────────────────────
# VXLAN is required for kind (kind nodes are Docker containers — no native routing)
tunnel: vxlan

# ── kube-proxy compatibility ───────────────────────────────────────────────
# kind ships with kube-proxy — do NOT replace it in base mode
# Set to "partial" to enable NodePort/ExternalIP handling by Cilium while
# keeping kube-proxy for ClusterIP. Full replacement breaks kind networking.
kubeProxyReplacement: "disabled"

# ── IPAM ──────────────────────────────────────────────────────────────────
ipam:
  mode: "kubernetes"              # Respect podCIDR assigned by kind per node
  operator:
    clusterPoolIPv4PodCIDRList:
      - "10.244.0.0/16"

# ── kind-specific settings ─────────────────────────────────────────────────
# Disable features that require hardware/bare-metal capabilities
hostServices:
  enabled: false
externalIPs:
  enabled: true
nodePort:
  enabled: true

# ── Image ──────────────────────────────────────────────────────────────────
image:
  pullPolicy: IfNotPresent        # Avoid repeat pulls in kind

# ── Observability ──────────────────────────────────────────────────────────
prometheus:
  enabled: true
  port: 9962

operator:
  prometheus:
    enabled: true

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true                 # Hubble UI — port-forward for visibility

# ── Resource limits (lab sizing) ──────────────────────────────────────────
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
